@if (state(); as s) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" role="dialog" aria-modal="true">

    <!-- خلفية معتمة -->
    <div class="absolute inset-0 bg-[#3B4A1F]/50 backdrop-blur-sm" (click)="confirm.answer(false)"></div>

    <!-- النافذة -->
    <div class="relative w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl">

      <div class="p-6 text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full"
          [class]="s.danger === false ? 'bg-[#C9D69A]/50 text-[#556B2F]' : 'bg-red-100 text-red-600'">
          <i class="fa-solid text-xl"
            [class]="s.danger === false ? 'fa-circle-question' : 'fa-trash-can'"></i>
        </div>

        <h3 class="mt-4 text-lg font-bold text-[#3B4A1F]">{{ s.title ?? 'Are you sure?' }}</h3>
        <p class="mt-1 text-sm text-[#7C8C3D]">{{ s.message ?? 'This action cannot be undone.' }}</p>
      </div>

      <div class="flex gap-3 border-t border-[#C9D69A]/60 bg-[#F7F9EE] px-6 py-4">
        <button type="button" (click)="confirm.answer(false)"
          class="flex-1 cursor-pointer rounded-xl border border-[#C9D69A] bg-white px-4 py-2.5 text-sm font-semibold text-[#3B4A1F] hover:bg-[#C9D69A]/40">
          {{ s.cancelText ?? 'Cancel' }}
        </button>
        <button type="button" (click)="confirm.answer(true)"
          class="flex-1 cursor-pointer rounded-xl px-4 py-2.5 text-sm font-semibold text-white"
          [class]="s.danger === false ? 'bg-[#556B2F] hover:bg-[#3B4A1F]' : 'bg-red-600 hover:bg-red-700'">
          {{ s.confirmText ?? 'Delete' }}
        </button>
      </div>
    </div>
  </div>
}
