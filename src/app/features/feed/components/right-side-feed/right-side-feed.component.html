<aside class="order-2 lg:order-3 bg-white rounded-xl shadow-lg p-4 lg:p-5">

  <!-- header -->
  <div class="flex items-center justify-between">
    <h3 class="flex items-center gap-2 font-bold text-[#3B4A1F] text-sm lg:text-base">
      <i class="fa-solid fa-user-group text-[#7C8C3D]"></i> Suggested Friends
    </h3>
    <div class="flex items-center gap-3">
      <span class="bg-[#C9D69A]/50 text-[#3B4A1F] text-xs font-semibold rounded-full px-2 py-0.5">{{ suggestData().length }}</span>
      <button type="button" (click)="toggleFriends()"
        class="lg:hidden text-xs font-semibold text-[#556B2F] cursor-pointer">
        {{ showFriends() ? 'Hide' : 'Show' }}
      </button>
    </div>
  </div>

  <div [class.hidden]="!showFriends()" class="lg:block">

    <!-- search -->
    <div class="relative mt-4">
      <i class="fa-solid fa-magnifying-glass absolute start-3 top-1/2 -translate-y-1/2 text-[#7C8C3D]"></i>
      <input type="text" [formControl]="searchInput" (input)="search()" placeholder="Search friends..."
        class="w-full rounded-xl border border-[#C9D69A] bg-[#F7F9EE] ps-9 pe-3 py-2 text-sm text-[#3B4A1F] placeholder:text-[#7C8C3D]/70 focus:outline-none focus:border-[#A3B263] focus:ring-2 focus:ring-[#C9D69A]" />
    </div>

    <!-- friends list -->
    <div class="mt-4 grid grid-cols-1 gap-3">

      @for (friend of filteredFriends(); track friend._id) {
        <div class="border border-[#C9D69A] rounded-xl p-3">
          <div class="flex items-center gap-3">
            <img [src]="friend.photo" [alt]="friend.name" class="w-11 h-11 rounded-full object-cover" />
            <div class="min-w-0 flex-1">
             <h4 [routerLink]="['/userProfile', friend._id]"
  class="cursor-pointer truncate text-sm font-bold text-[#3B4A1F] hover:underline">{{ friend.name }}</h4>
              <p class="truncate text-xs text-[#7C8C3D]">&#64;{{ friend.username }}</p>
            </div>
            <button type="button" (click)="getFollow(friend._id)"
              class="inline-flex items-center gap-1 bg-[#C9D69A]/40 hover:bg-[#C9D69A] text-[#3B4A1F] text-xs font-semibold rounded-full px-3 py-1.5 cursor-pointer">
              <i class="fa-solid fa-user-plus"></i> Follow
            </button>
          </div>

          <div class="mt-3 flex flex-wrap items-center gap-2">
            <span class="inline-block bg-[#F7F9EE] text-[#7C8C3D] text-xs rounded-full px-2 py-0.5">
              {{ friend.followersCount }} followers
            </span>
            <span class="inline-flex items-center gap-1 bg-[#F7F9EE] text-[#7C8C3D] text-xs rounded-full px-2 py-0.5">
              <i class="fa-solid fa-user-group text-[10px]"></i> {{ friend.mutualFollowersCount }} mutual
            </span>
          </div>
        </div>
      }

      @if (filteredFriends().length === 0) {
        <p class="mt-4 text-center text-sm text-[#7C8C3D]">No results found</p>
      }

    </div> <!-- /friends list -->
  </div>   <!-- /wrapper -->
</aside>
